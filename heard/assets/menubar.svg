<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22">
  <!-- Eight-ray Heard signal. Black template style; macOS auto-tints it. -->
  <defs>
    <rect id="ray" x="10.15" y="1.5" width="1.7" height="5.8" rx="0.85"/>
  </defs>
  <g fill="#000">
    <use href="#ray"/>
    <use href="#ray" transform="rotate(45 11 11)"/>
    <use href="#ray" transform="rotate(90 11 11)"/>
    <use href="#ray" transform="rotate(135 11 11)"/>
    <use href="#ray" transform="rotate(180 11 11)"/>
    <use href="#ray" transform="rotate(225 11 11)"/>
    <use href="#ray" transform="rotate(270 11 11)"/>
    <use href="#ray" transform="rotate(315 11 11)"/>
  </g>
</svg>
